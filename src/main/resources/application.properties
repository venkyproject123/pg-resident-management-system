

spring.application.name=pg-management

spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslMode=REQUIRED
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=${PORT:8081}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

app.upload.directory=${user.home}/pg-management-private-uploads
app.whatsapp.api-url=${WHATSAPP_API_URL:https://graph.facebook.com}
app.whatsapp.graph-version=${WHATSAPP_GRAPH_VERSION:v22.0}
app.whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
app.whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN:}
app.whatsapp.admin-number=${WHATSAPP_ADMIN_NUMBER:}
app.whatsapp.language=${WHATSAPP_TEMPLATE_LANGUAGE:en_US}
app.whatsapp.templates.otp=${WHATSAPP_OTP_TEMPLATE:}
app.whatsapp.templates.rent-paid=${WHATSAPP_RENT_PAID_TEMPLATE:}
app.whatsapp.templates.rent-reminder=${WHATSAPP_RENT_REMINDER_TEMPLATE:}
app.rent-reminders.cron=${RENT_REMINDER_CRON:0 0 9 * * *}
app.rent-reminders.zone=Asia/Kolkata
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
