

spring.application.name=pg-management

spring.datasource.url=jdbc:mysql://localhost:3306/pg_management
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=8081

app.upload.directory=${user.home}/pg-management-private-uploads
app.owner.setup-token=${OWNER_SETUP_TOKEN:}
app.owner.registration-token=${OWNER_REGISTRATION_TOKEN:}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
