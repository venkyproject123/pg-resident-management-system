

spring.application.name=pg-management

spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslMode=REQUIRED
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update

server.port=${PORT:8081}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
app.admin.username=${ADMIN_USERNAME:}
app.admin.password=${ADMIN_PASSWORD:}
app.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
app.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
app.twilio.from-number=${TWILIO_FROM_NUMBER:}

app.upload.directory=${user.home}/pg-management-private-uploads
app.logging.slow-request-threshold-ms=${SLOW_REQUEST_THRESHOLD_MS:1000}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
